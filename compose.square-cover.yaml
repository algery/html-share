# Overlay for compose.yaml or compose.mysql.yaml.
services:
  square-cover-init:
    image: node:24-alpine
    user: "0:0"
    command: ["sh", "-c", "chown 1000:1000 /cover-ipc && chmod 0770 /cover-ipc"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - square-cover-ipc:/cover-ipc
    restart: "no"

  square-cover-renderer:
    build:
      context: .
      dockerfile: apps/cover-renderer/Dockerfile
    depends_on:
      square-cover-init:
        condition: service_completed_successfully
    network_mode: none
    read_only: true
    user: "1000:1000"
    init: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/square-cover/playwright-seccomp.json
    tmpfs:
      - /tmp:size=192m,mode=1777
    shm_size: 128m
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.5
    volumes:
      - square-cover-ipc:/cover-ipc
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get({socketPath:'/cover-ipc/render.sock',path:'/health'},r=>{r.resume();process.exit(r.statusCode===204?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    environment:
      SQUARE_COVER_SOCKET: /cover-ipc/render.sock
    depends_on:
      square-cover-init:
        condition: service_completed_successfully
    volumes:
      - square-cover-ipc:/cover-ipc:ro

volumes:
  square-cover-ipc:
