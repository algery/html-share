# Paste this location block into the demo-domain site's OpenResty server block.
# Remove the default generated `location /` first to avoid a duplicate.

location / {
    proxy_pass http://127.0.0.1:13001;
    proxy_http_version 1.1;
    # Keep X-Forwarded-Proto inside this location. Defining any proxy_set_header
    # here prevents inheritance of server-level proxy_set_header directives.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
