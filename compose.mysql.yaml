# Standalone MySQL topology; never combine with compose.yaml.
name: html-share

x-database-environment: &database-environment
  DATABASE_DEPLOYMENT_TARGET_FILE: /deployment-target/target.json
  LOCAL_DATABASE_CONTAINER_OVERRIDE: ${CONTAINER_DATABASE_URL+true}
  DATABASE_PROVIDER: ${DATABASE_PROVIDER-postgresql}
  # The runtime wrapper maps only the exact documented local loopback target.
  # Explicit external DATABASE_URL values are preserved.
  POSTGRES_USER: ${POSTGRES_USER:-html_share}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-html_share_local}
  POSTGRES_DB: ${POSTGRES_DB:-html_share}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  MYSQL_USER: ${MYSQL_USER:-html_share}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-html_share_local}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-html_share}
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  DATABASE_URL: ${CONTAINER_DATABASE_URL-${DATABASE_URL:?DATABASE_URL is required}}

services:
  deployment-init:
    build:
      context: .
      target: server
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /deployment-target && chown node:node /deployment-target"]
    restart: "no"
    read_only: true
    network_mode: none
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - deployment-targets:/deployment-target

  migrate:
    build:
      context: .
      target: server
    working_dir: /workspace
    command:
      [
        "node",
        "/workspace/scripts/database-stack.mjs",
        "--exec",
        "sh",
        "-c",
        "pnpm db:migrate:deploy && node scripts/database-deployment-preflight.mjs --write-target=/deployment-target/target.json",
      ]
    environment: *database-environment
    depends_on:
      deployment-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    restart: "no"

    volumes:
      - deployment-targets:/deployment-target

  web:
    build:
      context: .
      target: web
      args:
        # Next.js public variables are replaced at image build time. Keep these
        # in build args as well as the runtime environment for observability.
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
        NEXT_PUBLIC_DEMO_URL: ${NEXT_PUBLIC_DEMO_URL:?NEXT_PUBLIC_DEMO_URL is required}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_DINGTALK_CLIENT_ID: ${NEXT_PUBLIC_DINGTALK_CLIENT_ID:-}
        NEXT_PUBLIC_DINGTALK_CORP_ID: ${NEXT_PUBLIC_DINGTALK_CORP_ID:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NEXT_PUBLIC_DEMO_URL: ${NEXT_PUBLIC_DEMO_URL:?NEXT_PUBLIC_DEMO_URL is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
      NEXT_PUBLIC_DINGTALK_CLIENT_ID: ${NEXT_PUBLIC_DINGTALK_CLIENT_ID:-}
      NEXT_PUBLIC_DINGTALK_CORP_ID: ${NEXT_PUBLIC_DINGTALK_CORP_ID:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    command: ["node", "/workspace/scripts/database-stack.mjs", "--exec", "pnpm", "start"]
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST is required}
      APP_AUTH_URL: ${APP_AUTH_URL:?APP_AUTH_URL is required}
      APP_WEB_URL: ${APP_WEB_URL:?APP_WEB_URL is required}
      ADMIN_DINGTALK_USER_IDS: ${ADMIN_DINGTALK_USER_IDS:-}
      AUTH_STATE_SECRET: ${AUTH_STATE_SECRET:?AUTH_STATE_SECRET is required}
      MCP_TOKEN_HASH_SECRET: ${MCP_TOKEN_HASH_SECRET:?MCP_TOKEN_HASH_SECRET is required}
      PASSWORD_RESULT_ENCRYPTION_KEY: ${PASSWORD_RESULT_ENCRYPTION_KEY:?PASSWORD_RESULT_ENCRYPTION_KEY is required}
      PASSWORD_MANAGEMENT_ENCRYPTION_KEY: ${PASSWORD_MANAGEMENT_ENCRYPTION_KEY:?PASSWORD_MANAGEMENT_ENCRYPTION_KEY is required}
      PASSWORD_VERIFY_IP_RATE_LIMIT_PER_MINUTE: ${PASSWORD_VERIFY_IP_RATE_LIMIT_PER_MINUTE:-60}
      PASSWORD_VERIFY_IP_PROJECT_RATE_LIMIT_PER_MINUTE: ${PASSWORD_VERIFY_IP_PROJECT_RATE_LIMIT_PER_MINUTE:-30}
      PASSWORD_VERIFY_PROJECT_RATE_LIMIT_PER_MINUTE: ${PASSWORD_VERIFY_PROJECT_RATE_LIMIT_PER_MINUTE:-120}
      MAX_DEMOS_PER_USER: ${MAX_DEMOS_PER_USER-100}
      DEMO_HOST: ${DEMO_HOST:?DEMO_HOST is required}
      DEMO_AUTH_URL: ${DEMO_AUTH_URL:?DEMO_AUTH_URL is required}
      DEMO_WEB_URL: ${DEMO_WEB_URL:?DEMO_WEB_URL is required}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3001
      <<: *database-environment
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PROVIDER: minio
      # The container resolves this Docker Desktop alias while the returned URL
      # remains reachable from the local host running the Agent upload script.
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://host.docker.internal:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:?OBJECT_STORAGE_REGION is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      OBJECT_STORAGE_ACCESS_KEY_SECRET: ${OBJECT_STORAGE_ACCESS_KEY_SECRET:?OBJECT_STORAGE_ACCESS_KEY_SECRET is required}
      DINGTALK_AUTH_MODE: ${DINGTALK_AUTH_MODE:?DINGTALK_AUTH_MODE is required}
      FEISHU_ENABLED: ${FEISHU_ENABLED:-false}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_TENANT_KEY: ${FEISHU_TENANT_KEY:-}
      DINGTALK_DIRECTORY_ENABLED: ${DINGTALK_DIRECTORY_ENABLED:-false}
      DINGTALK_CONTACT_API_BASE_URL: ${DINGTALK_CONTACT_API_BASE_URL:-https://oapi.dingtalk.com}
      DINGTALK_APP_ID: ${DINGTALK_APP_ID:-}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_API_BASE_URL: ${DINGTALK_API_BASE_URL:-}
      DINGTALK_EXTERNAL_AUTHORIZE_URL: ${DINGTALK_EXTERNAL_AUTHORIZE_URL:-}
    ports:
      - "127.0.0.1:${SERVER_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:3001/health/ready',{headers:{host:process.env.APP_HOST}},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    volumes:
      - deployment-targets:/deployment-target

  worker:
    command: ["node", "/workspace/scripts/database-stack.mjs", "--exec", "pnpm", "start"]
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: 3002
      UPLOAD_HEAD_OBJECT_TIMEOUT_MS: ${UPLOAD_HEAD_OBJECT_TIMEOUT_MS:-10000}
      <<: *database-environment
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_PROVIDER: minio
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://host.docker.internal:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:?OBJECT_STORAGE_REGION is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      OBJECT_STORAGE_ACCESS_KEY_SECRET: ${OBJECT_STORAGE_ACCESS_KEY_SECRET:?OBJECT_STORAGE_ACCESS_KEY_SECRET is required}
    ports:
      - "127.0.0.1:${WORKER_PORT:-3002}:3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    volumes:
      - deployment-targets:/deployment-target

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=tcp -h 127.0.0.1 -u $$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  deployment-targets:
  mysql-data:
  minio-data:
